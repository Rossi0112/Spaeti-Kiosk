<style>
:root{--bg:#fafaf7;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#e8590c;--bd:#e3e3dc;--ok:#2f9e44;--bad:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

<script>
const $=s=>document.querySelector(s);
const eur=n=>(Math.round(n*100)/100).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const S={tab:"kiosk",admin:false,uid:null,name:"",items:[],stock:{},wd:[],mine:[],names:{},cust:null,customers:[],watching:null,unsub:null,pick:null,db:null,user:null};
function toast(t){const m=$("#msg");m.textContent=t;m.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display="none",2200)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

async function init(){
  render();
  try{
    const c=window.claude; if(!c){$("#app").textContent="Bitte als Artifact in Claude öffnen.";return}
    S.db=await c.use("db"); S.user=await c.use("user");
    if(!S.db||!S.user){$("#app").textContent="Bitte anmelden, um den Kiosk zu nutzen.";return}
    S.admin=await S.user.canEdit(); S.uid=await S.user.id();
    try{const me=await S.user.me();S.name=me.name||""}catch(e){}
    if(S.admin)S.tab="lager";
    S.db.collection("items").onSnapshot(s=>{S.items=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||"").localeCompare(b.name||""));render()},()=>{});
    S.db.collection("customers").onSnapshot(s=>{S.customers=s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(x.name||"").localeCompare(y.name||""));S.cust=S.customers.find(c=>c.id===(S.cust&&S.cust.id))||S.customers.find(c=>(c.claimedBy||[]).includes(S.uid))||null;watchMine();render()},()=>{});
    if(S.admin){
      S.db.collection("stock").onSnapshot(s=>{S.stock={};s.docs.forEach(d=>S.stock[d.id]=d.data().added||0);render()},()=>{});
      S.db.collection("withdrawals").onSnapshot(async s=>{S.wd=s.docs.flatMap(d=>(d.data().entries||[]).map(x=>({...x,user:d.id})));
        try{const ids=[...new Set(S.wd.map(w=>w.user))];const p=await S.user.profiles(ids);ids.forEach(i=>S.names[i]=(p[i]&&p[i].name)||"Kunde");}catch(e){}
        render()},()=>{});
    }
  }catch(e){$("#app").textContent="Fehler beim Laden."}
}

function render(){
  const nav=$("#nav");nav.textContent="";
  const tabs=[["kiosk","🛒 Kiosk"],["konto","💳 Mein Konto"]];
  if(S.admin)tabs.push(["lager","📦 Lagerbestand"]);if(S.admin||(S.cust&&S.cust.mod))tabs.push(["konten","👥 Kundenkonten"]);
  tabs.forEach(([k,l])=>{const b=document.createElement("button");b.textContent=l;b.className=S.tab===k?"on":"";b.onclick=()=>{S.tab=k;render()};nav.append(b)});
  const a=$("#app");a.textContent="";
  ({kiosk,konto,lager,konten})[S.tab]?.(a);
}
function el(t,cls,txt){const e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function kiosk(a){
  if(!S.cust)return loginView(a);
  a.append(el("div","mu","Angemeldet als "+S.cust.name));
  if(!S.items.length){a.append(el("p","mu","Noch keine Artikel im Kiosk."));return}
  const known=["Getränke","Süßigkeiten"];
  [...known,"Sonstige"].forEach(g=>{const list=S.items.filter(i=>g==="Sonstige"?!known.includes(i.cat):i.cat===g);if(!list.length)return;a.append(el("h2","",(g==="Getränke"?"🥤 ":g==="Süßigkeiten"?"🍫 ":"")+g));
  list.forEach(i=>{
    const c=el("div","card");const l=el("div");l.append(el("div","",i.name));
    const r=el("div");r.style.cssText="display:flex;gap:10px;align-items:center";
    const b=el("button","act","Nehmen");b.onclick=()=>take(i,b);
    r.append(el("span","pr",eur(i.price)),b);c.append(l,r);a.append(c)});});
}
async function take(i,b){
  if(!S.db)return;b.disabled=true;
  const e={user:S.cust.id,item:i.id,name:i.name,price:i.price,qty:1,ts:Date.now()};
  try{
    const wr=S.db.doc("withdrawals/"+S.cust.id);const cur=await wr.get();const list=(cur.exists&&cur.data().entries)||[];list.push(e);await wr.set({cust:S.cust.id,entries:list});
    toast(i.name+" auf dein Konto gebucht: "+eur(i.price));
  }catch(x){toast("Buchung fehlgeschlagen")}
  b.disabled=false;
}
function konto(a){
  if(!S.cust)return loginView(a);
  const sum=S.mine.reduce((s,e)=>s+e.price*e.qty,0);
  a.append(el("div","mu","Offener Betrag"),el("div","tot",eur(sum)),el("h2","","Meine Entnahmen"));
  if(!S.mine.length)a.append(el("p","mu","Noch nichts entnommen."));
  S.mine.forEach(e=>{const c=el("div","card");const l=el("div");l.append(el("div","",e.name),el("div","mu",new Date(e.ts).toLocaleString("de-DE")));c.append(l,el("span","pr",eur(e.price*e.qty)));a.append(c)});
}
function remaining(id){const used=S.wd.filter(w=>w.item===id).reduce((s,w)=>s+w.qty,0);return (S.stock[id]||0)-used}
function lager(a){
  const mod=!!(!S.admin&&S.cust&&S.cust.mod);
  if(!S.admin&&!mod){a.append(el("p","mu","Nur für Administratoren."));return}
  const f=el("div","card");f.style.display="block";
  f.append(el("b","","Neuer Artikel"));
  const n=el("input");n.placeholder="Name";const p=el("input");p.placeholder="Preis €";p.inputMode="decimal";const q=el("input");q.placeholder="Anfangsbestand";q.inputMode="numeric";const k=el("select");["Getränke","Süßigkeiten"].forEach(v=>{const o=el("option","",v);o.value=v;k.append(o)});k.style.cssText="font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%";
  const r=el("div","row");r.style.marginTop="6px";r.append(n,p);const r2=el("div","row");r2.append(q,k);
  const b=el("button","act","Anlegen");
  b.onclick=async()=>{const price=parseFloat(p.value.replace(",","."));if(!n.value.trim()||isNaN(price))return toast("Name und Preis nötig");
    const id=uid();await S.db.doc("items/"+id).set({name:n.value.trim(),price,cat:k.value});await S.db.doc("stock/"+id).set({added:parseInt(q.value)||0});toast("Artikel angelegt")};
  f.append(r,r2,b);if(!mod)a.append(f);
  const known=["Getränke","Süßigkeiten"];
  [...known,"Sonstige"].forEach(g=>{const list=S.items.filter(i=>g==="Sonstige"?!known.includes(i.cat):i.cat===g);if(!list.length&&g==="Sonstige")return;a.append(el("h2","",(g==="Getränke"?"🥤 ":g==="Süßigkeiten"?"🍫 ":"")+g+" ("+list.length+")"));if(!list.length)a.append(el("p","mu","Keine Artikel."));
  list.forEach(i=>{
    const c=el("div","card");const l=el("div");const rem=remaining(i.id);
    l.append(el("div","",i.name),el("div","mu",eur(i.price)));
    const rr=el("div");rr.style.cssText="display:flex;gap:6px;align-items:center";
    rr.append(el("span",rem<=3?"pr low":"pr",rem+" Stk."));
    const qi=el("input");qi.type="number";qi.min=1;qi.placeholder="Menge";qi.style.width="72px";const add=el("button","sm","+ Nachfüllen");add.onclick=async()=>{const v=parseInt(qi.value);if(v>0){await S.db.doc("stock/"+i.id).set({added:(S.stock[i.id]||0)+v});toast(i.name+": +"+v)}};
    const pr=el("button","sm","Preis");pr.onclick=async()=>{const v=parseFloat((prompt("Neuer Preis in €:",i.price)||"").replace(",","."));if(!isNaN(v))await S.db.doc("items/"+i.id).update({price:v})};
    const del=el("button","sm","✕");del.onclick=async()=>{if(confirm(i.name+" löschen?")){await S.db.doc("items/"+i.id).delete();await S.db.doc("stock/"+i.id).delete()}};
    rr.append(...(mod?[qi,add]:[qi,add,pr,del]));c.append(l,rr);c.style.flexWrap="wrap";a.append(c)});});
  if(!S.items.length)a.append(el("p","mu","Noch keine Artikel – lege den ersten oben an."));
}
function konten(a){
  if(!S.admin&&!(S.cust&&S.cust.mod)){a.append(el("p","mu","Nur für Administratoren."));return}
  qrCard(a);const bal={};S.wd.forEach(w=>{bal[w.user]=(bal[w.user]||0)+w.price*w.qty});
  const f=el("div","row");const n=el("input");n.placeholder="Neuer Kunde (Name)";const nb=el("button","act","+");
  nb.onclick=async()=>{const nm=n.value.trim();if(!nm)return;await S.db.doc("customers/"+uid()).set({name:nm,codeHash:"",claimedBy:[]});n.value=""};
  f.append(n,nb);a.append(f);
  S.customers.forEach(c=>{const d=el("div","card");d.style.flexWrap="wrap";const l=el("div");l.append(el("div","",c.name),el("div","mu",c.codeHash?"registriert":"noch nicht registriert"));
    const r=el("div");r.style.cssText="display:flex;gap:8px;align-items:center";r.append(el("span","pr",eur(bal[c.id]||0)));
    if(c.codeHash){const x=el("button","sm","Code zurücksetzen");x.onclick=()=>S.db.doc("customers/"+c.id).update({codeHash:"",claimedBy:[]});r.append(x)}
    if(S.admin){const m=el("button","sm");const st=el("span","",c.mod?"★":"☆");if(c.mod){st.style.color="#fcc419";m.style.borderColor="#fcc419"}m.append(st,document.createTextNode(" Mitverwalter"));m.onclick=()=>S.db.doc("customers/"+c.id).update({mod:!c.mod});r.append(m)}
    d.append(l,r);a.append(d)});
}
function watchMine(){
  if(S.cust&&S.cust.mod&&!S.admin&&!S.wdOn){S.wdOn=1;S.db.collection("withdrawals").onSnapshot(s=>{S.wd=s.docs.flatMap(d=>(d.data().entries||[]).map(x=>({...x,user:d.id})));render()},()=>{})}
  if(!S.cust||S.watching===S.cust.id)return;S.watching=S.cust.id;if(S.unsub)S.unsub();
  S.unsub=S.db.doc("withdrawals/"+S.cust.id).onSnapshot(d=>{S.mine=((d.exists&&d.data().entries)||[]).slice().sort((x,y)=>y.ts-x.ts);render()},()=>{});
}
async function hash(id,code){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(id+":"+code));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function loginView(a){
  a.append(el("h2","","Willkommen im Späti"));newCard(a);
  if(onlyNew){const nb=el("button","sm","Ich stehe schon in der Liste");nb.onclick=()=>{onlyNew=false;render()};a.append(nb);return}
  a.append(el("h2","","Schon Kunde?"),el("p","mu","Wähle deinen Namen und gib deinen Code ein. Beim ersten Mal vergibst du einen vierstelligen Code."));
  if(!S.customers.length){a.append(el("p","mu","Noch keine Kunden angelegt."));return}
  S.customers.forEach(c=>{
    const d=el("div","card");d.style.flexWrap="wrap";d.append(el("span","",c.name));
    if(S.pick!==c.id){const b=el("button","act",c.codeHash?"Anmelden":"Registrieren");b.onclick=()=>{S.pick=c.id;render()};d.append(b)}
    else{
      const first=!c.codeHash;const r=el("div","row");r.style.cssText="width:100%;margin:0";
      const mk=p=>{const i=el("input");i.type="password";i.inputMode="numeric";i.maxLength=4;i.placeholder=p;return i};
      const i1=mk(first?"Neuer 4-stelliger Code":"4-stelliger Code");r.append(i1);
      let i2=null;if(first){i2=mk("Code wiederholen");r.append(i2)}
      const ok=el("button","act","OK");ok.onclick=()=>codeSubmit(c,i1.value,i2&&i2.value);r.append(ok);d.append(r);
    }
    a.append(d)});
}
async function codeSubmit(c,v,v2){
  if(!/^\d{4}$/.test(v))return toast("Bitte genau 4 Ziffern");
  const first=!c.codeHash;let h;try{h=await hash(c.id,v)}catch(e){return toast("Nicht möglich")}
  if(first&&v!==v2)return toast("Codes stimmen nicht überein");
  if(!first&&h!==c.codeHash)return toast("Falscher Code");
  try{await S.db.doc("customers/"+c.id).update({codeHash:h,claimedBy:[...new Set([...(c.claimedBy||[]),S.uid])]});S.cust=c;S.pick=null;watchMine();toast("Willkommen, "+c.name+"!");render()}catch(e){toast("Anmeldung fehlgeschlagen")}
}
let onlyNew=false;try{onlyNew=location.hash==="#neu"}catch(e){}
function newCard(a){
  const d=el("div","card");d.style.display="block";d.append(el("b","","Neu hier? Als neuer Kunde anmelden"));
  const mk=(p,pw)=>{const i=el("input");i.placeholder=p;if(pw){i.type="password";i.inputMode="numeric";i.maxLength=4}i.style.marginTop="6px";return i};
  const n=mk("Dein Name"),c1=mk("Neuer 4-stelliger Code",1),c2=mk("Code wiederholen",1);
  const b=el("button","act","Registrieren");b.style.marginTop="8px";
  b.onclick=async()=>{const nm=n.value.trim();
    if(!nm)return toast("Bitte Namen eingeben");
    if(!/^\d{4}$/.test(c1.value))return toast("Bitte genau 4 Ziffern");
    if(c1.value!==c2.value)return toast("Codes stimmen nicht überein");
    if(S.customers.some(c=>(c.name||"").toLowerCase()===nm.toLowerCase()))return toast("Name gibt es schon – bitte unten in der Liste wählen");
    const id=uid();try{await S.db.doc("customers/"+id).set({name:nm,codeHash:await hash(id,c1.value),claimedBy:[S.uid]});toast("Willkommen, "+nm+"!")}catch(e){toast("Registrierung fehlgeschlagen")}};
  d.append(n,c1,c2,b);a.append(d);
}
function qrCard(a){
  const url="https://claude.ai/artifact/4DaqxSeYn6TNbwhjFhrSmo#neu";
  const d=el("div","card");d.style.display="block";d.style.textAlign="center";d.append(el("b","","QR-Code für neue Kunden"));
  if(typeof qrcode==="function"){const q=qrcode(0,"M");q.addData(url);q.make();const w=el("div");w.style.cssText="background:#fff;padding:8px;display:inline-block;margin:8px 0;border-radius:8px;display:block;width:fit-content;margin:8px auto";w.innerHTML=q.createSvgTag(5,2);d.append(w)}
  d.append(el("div","mu",url));a.append(d);
}
init();
</script></body></html>
